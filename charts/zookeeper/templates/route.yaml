kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: zoonavigator
  namespace: {{ template "zookeeper.namespace" . }}
  labels:
    app: zoonavigator
    app.kubernetes.io/component: zoonavigator
    app.kubernetes.io/instance: zoonavigator
    app.kubernetes.io/name: zoonavigator
    app.kubernetes.io/part-of: zookeeper
    app.openshift.io/runtime-version: latest
  annotations:
    openshift.io/host.generated: 'true'
spec:
  host: zookeeper-rms-test.apps.lims.gcgenome.com
  to:
    kind: Service
    name: zoonavigator
    weight: 100
  port:
    targetPort: 9000-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
