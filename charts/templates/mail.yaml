kind: ConfigMap
apiVersion: v1
metadata:
  name: mail
  namespace: {{ .Release.Namespace }}
data:
  mail.yaml: |
    spring:
      mail:
        host: smtp.gmail.com
        port: 587
        username: ${mail.username}
        password: ${mail.password}
        properties:
          mail:
            smtp:
              auth: true
              timeout: 5000
              starttls:
                enable: true
