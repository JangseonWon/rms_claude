apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-postgresql-ha
  namespace: openshift-gitops
spec:
  destination:
    namespace: {{ .Release.Namespace }}
    server: 'https://kubernetes.default.svc'
  project: {{ .Release.Namespace }}
  source:
    chart: lims-postgresql-ha
    repoURL: 'https://gitea.apps.gcgenome.com/api/packages/LIMS/helm'
    targetRevision: 0.3.0
    helm:
      values: |
        postgresql-ha:
          global:
            postgresql:
              database: rms
              existingSecret: postgresql
            pgpool:
              existingSecret: postgresql
          commonLabels:
            app.kubernetes.io/part-of: database
            app.kubernetes.io/name: postgresql
          commonAnnotations:
            app.openshift.io/vcs-uri: 'https://github.com/bitnami/charts/tree/main/bitnami/postgresql-ha'
          postgresql:
            podLabels:
              app: postgresql
              version: 15.4.0
            podAnnotations:
              sidecar.istio.io/inject: 'true'
            {{- if .Values.postgresql.postgresql }}
            {{- with .Values.postgresql.postgresql.maxConnections }}
            maxConnections: {{ . }}
            {{- end }}
            {{- end }}
          pgpool:
            podLabels:
              app: postgresql
              version: 4.4.4
            podAnnotations:
              sidecar.istio.io/inject: 'true'
            {{- if .Values.postgresql.pgpool }}
            {{- with .Values.postgresql.pgpool.numInitChildren }}
            numInitChildren: {{ . }}
            {{- end }}
            {{- with .Values.postgresql.pgpool.childMaxConnections }}
            childMaxConnections: {{ . }}
            {{- end }}
            {{- with .Values.postgresql.pgpool.serviceLabels }}
            serviceLabels:
              {{ toYaml . }}
            {{- end }}
            {{- with .Values.postgresql.pgpool.serviceAnnotations }}
            serviceAnnotations:
              {{ toYaml . }}
            {{- end }}
            {{- end }}
          serviceAccount:
            name: postgres
          {{- with .Values.postgresql.persistence }}
          persistence:
            {{ toYaml . }}
          {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true