kind: ConfigMap
apiVersion: v1
metadata:
  name: lims-service
  namespace: {{ .Release.Namespace }}
data:
  application.yaml: |
    spring:
      application:
        name: rms-lims-service
      config:
        import:
          - classpath:authentication.yaml
          - classpath:database.yaml
          - classpath:s3.yaml
          - classpath:kafka.yaml
      main:
        web-application-type: reactive
    server:
      port: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: '*'
    app.openshift.io/route-disabled: 'false'
    app.openshift.io/vcs-uri: 'https://github.com/GC-Genome/rms.git'
    reloader.stakater.com/auto: 'true'
  name: lims-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: lims-service
    app.openshift.io/runtime: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lims-service
  template:
    metadata:
      labels:
        app: lims-service
      annotations:
        sidecar.istio.io/inject: 'true'
    spec:
      volumes:
        - name: config
          configMap:
            name: lims-service
            defaultMode: 420
        - name: authentication-config
          configMap:
            name: authentication
            defaultMode: 420
        - name: database-config
          configMap:
            name: database
            defaultMode: 420
        - name: s3-config
          configMap:
            name: s3
            defaultMode: 420
        - name: kafka-config
          configMap:
            name: kafka
            defaultMode: 420
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: lims-service
          env:
            - name: database.url
              valueFrom:
                secretKeyRef:
                  name: database
                  key: url
            - name: database.username
              valueFrom:
                secretKeyRef:
                  name: database
                  key: username
            - name: database.password
              valueFrom:
                secretKeyRef:
                  name: database
                  key: password
            - name: jwt.public
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: public
            - name: rms-s3-credentials.access-key
              valueFrom:
                secretKeyRef:
                  name: rms-s3-credentials
                  key: access-key
            - name: rms-s3-credentials.secret-key
              valueFrom:
                secretKeyRef:
                  name: rms-s3-credentials
                  key: secret-key
            - name: rms-s3-credentials.endpoint
              valueFrom:
                secretKeyRef:
                  name: rms-s3-credentials
                  key: endpoint
            - name: rms-s3-credentials.bucket
              valueFrom:
                secretKeyRef:
                  name: rms-s3-credentials
                  key: bucket
            - name: kafka.gemini
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: gemini
            - name: kafka.pisces
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: pisces
            - name: kafka.aries
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: aries
            - name: kafka.taurus
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: taurus
            - name: kafka.libra
              valueFrom:
                secretKeyRef:
                  name: kafka
                  key: libra
            - name: TZ
              value: Asia/Seoul
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config
              mountPath: /app/resources/application.yaml
              subPath: application.yaml
            - name: database-config
              mountPath: /app/resources/database.yaml
              subPath: database.yaml
            - name: authentication-config
              mountPath: /app/resources/authentication.yaml
              subPath: authentication.yaml
            - name: s3-config
              mountPath: /app/resources/s3.yaml
              subPath: s3.yaml
            - name: kafka-config
              mountPath: /app/resources/kafka.yaml
              subPath: kafka.yaml
          terminationMessagePolicy: File
          image: 'image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}/lims-service:latest'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: rms-lims-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: 80-tcp
      protocol: TCP
      port: 80
      targetPort: 8080
  selector:
    app: lims-service
---
kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: lims-service
  namespace: {{ .Release.Namespace }}
spec:
  lookupPolicy:
    local: false
