apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: request.gcgenome.com-ca
  namespace: istio-system
spec:
  commonName: request.gcgenome.com
  dnsNames:
    - request.gcgenome.com
    - report.gcgenome.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: request.gcgenome.com-ca