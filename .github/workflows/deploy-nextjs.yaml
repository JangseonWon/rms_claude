name: 프론트엔드 배포
on:
  push:
    branches:
      - develop
    paths:
      - rms-client/**
permissions: write-all
jobs:
  deploy:
    runs-on: ubi9
    env:
      IMAGE_REGISTRY_TEST: ${{ secrets.IMAGE_REGISTRY_TEST }}
      REGISTRY_USERNAME_TEST: ${{ secrets.REGISTRY_USERNAME_TEST }}
      REGISTRY_PASSWORD_TEST: ${{ secrets.REGISTRY_PASSWORD_TEST }}
      BASE_URL_TEST: ${{ secrets.BASE_URL_TEST }}
      AUTH_SECRET_TEST: ${{ secrets.AUTH_SECRET_TEST }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Packaging and push
        run: |
          export IMAGE="rms-test/rms-client"
          export REGISTRY_USERNAME=$REGISTRY_USERNAME_TEST
          export REGISTRY_PASSWORD=$REGISTRY_PASSWORD_TEST
          export BASE_URL=$BASE_URL_TEST
          export AUTH_SECRET=$AUTH_SECRET_TEST
        
          
          cd rms-client/rms
          chmod +x build-image.sh && \
          ./build-image.sh docker \
          -i $IMAGE:latest \
          -r image-registry.apps.gcgenome.com \
          -u $REGISTRY_USERNAME \
          -p $REGISTRY_PASSWORD \
          --auth-secret "$AUTH_SECRET" \
          --base-url "$BASE_URL"