spring:
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://libra:5432/report_service
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
server:
  port: 0