spring:
  datasource:
    url: ${ALIS_DATABASE_URL}
    username: ${ALIS_DATABASE_USERNAME}
    password: ${ALIS_DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server:
  port: 4444

logging:
  level:
    io.r2dbc.postgresql.QUERY: TRACE # for queries